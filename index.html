<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
  <title>SchemaApp</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SchemaApp">
  <link rel="apple-touch-icon" href="./icons/s3.png">
  <meta name="mobile-web-app-capable" content="yes">


  <!-- Theme Colors -->
  <meta name="theme-color" content="#FFFFFF">

  <!-- Styles -->


<link rel="stylesheet" href="./css/index.css">
</head>
<body>

    <div class="centered-page-container">
      <div class="brand-header">
        <img src="./icons/s3.png" class="animated-brand-icon">
        <div class="brand-title">SchemaApp</div>
      </div>
      <div class="page-content">
        <div id="gtt" style="display: none;" class="install-instructions-panel">
            <div class="instruction-row">
                <img class="instruction-icon t" src="./icons/compass.png">
                <div class="instruction-text">Open this page in Safari</div>
            </div>
            <div class="instruction-row">
                <img class="instruction-icon r" src="./icons/ios_share.svg">
                <div class="instruction-text">Click the "Share" button</div>
            </div>
            <div class="instruction-row">
                <img class="instruction-icon" src="./icons/add.png">
                <div class="instruction-text">and choose "Add to Home Screen"</div>
            </div>
        </div>
        <button id="qw" class="install-app-button" style="display: none;">Install App</button>
        <a href="https://williamlundberg10.github.io/app/Privacy_Policy.txt">Privacy_Policy</a>
      </div>
    </div>


    <script>
        var bb1 = document.getElementById("qw")
        var bb11 = document.getElementById("gtt")
        let deferredPrompt;
        const os = getOS();
        console.log("Detected OS:", os);

        if(os == "Android"){
            bb1.style.display = "flex"
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                bb1.style.display = 'block'; // Show button on Android
            });
            bb1.addEventListener('click', async () => {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response: ${outcome}`);
                deferredPrompt = null;
            });
        }

        if(os == "iOS"){
            bb11.style.display = "flex"
        }

        function getOS() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // iOS detection
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                return "iOS";
            }

            // Android detection
            if (/android/i.test(userAgent)) {
                return "Android";
            }

            return "Other";
            }

    </script>

</body>
</html>
