<!DOCTYPE html>

<head>

  <title>SchemaApp</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="../manifest.json">

  <!-- iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SchemaApp">
  <link rel="apple-touch-icon" href="../icons/s3.png">
  <meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="../css/settings.css">

<body>

    <div class="schedule-page-container">
        <div class="top-navigation-bar">
            <button id="aa_1" class="class-name-button">7-9D</button>

        </div>

        <div class="schedule-column is-entering" id="dff">
            <div class='schedule-top-spacer'></div>
            <div class="language-selector">
                <div id="faa_sv" onclick="lla('sv')" class="language-option">
                    <h3>SV</h3>
                </div>
                <div id="faa_en" onclick="lla('en')" class="language-option">

                </div>
            </div>
            <div class="settings-row">
                <h3 data-ll="s_Hide_R/P">Hide Rast/Paus</h3>

                </label>
            </div>
            <div id="ffc" class="settings-row">

            </div>

                <h3 data-ll="s_Logout">Log out</h3>
            </div>
            <div class="settings-row">
                <h3>B_v2.4</h3>
            </div>
            <a class="settings-row" href="https://williamlundberg10.github.io/app/Privacy_Policy.txt" target="_blank" rel="noopener noreferrer" aria-label="Open Privacy Policy">
                <h3 data-ll="s_Privacy_Policy">Privacy Policy</h3>
            </a>
            <a class="settings-row" href="../html/admin.html" target="_blank" rel="noopener noreferrer" aria-label="Open Privacy Policy">
                <h3 data-ll="s_Admin">Admin</h3>
            </a>

        </div>

        <div id="dee" class="weekday-navigation">
            <button id="qq_1" class="weekday-button is-unselected">M</button>
            <button id="qq_2" class="weekday-button is-unselected">T</button>
            <button id="qq_3" class="weekday-button is-unselected">O</button>
            <button id="qq_4" class="weekday-button is-unselected">T</button>
            <button id="qq_5" class="weekday-button is-unselected">F</button>
      </div>
    </div>


    <script type="module" src="../js/a.js"></script>
